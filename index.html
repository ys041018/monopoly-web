<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b7e6ff">
  <title>大富翁 - 网页联机版</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="sound-toggle" class="sound-toggle" title="音效开关">🔊</button>
  <!-- 登录 / 注册 -->
  <div id="auth-screen" class="screen">
    <div class="card lobby-card">
      <h1 class="logo"><img src="assets/logo-dice.svg" class="logo-icon" alt="">大富翁</h1>
      <p class="subtitle">登录 / 注册后进入游戏</p>
      <div class="ornament-divider"></div>
      <div id="auth-panel" class="auth-panel">
        <h2>账号</h2>
        <input id="auth-user" type="text" maxlength="20" placeholder="用户名">
        <input id="auth-pass" type="password" maxlength="40" placeholder="密码">
        <input id="auth-nick" type="text" maxlength="12" placeholder="昵称（注册用，可选）">
        <div class="auth-btns">
          <button id="auth-login-btn" class="btn primary">登录</button>
          <button id="auth-register-btn" class="btn ghost">注册</button>
        </div>
      </div>
      <p id="auth-msg" class="msg"></p>
    </div>
  </div>

  <!-- 大厅 -->
  <div id="lobby" class="screen hidden">
    <div class="card lobby-card">
      <h1 class="logo"><img src="assets/logo-dice.svg" class="logo-icon" alt="">大富翁</h1>
      <p class="subtitle">单房间 · 2~8 人联机</p>
      <div class="ornament-divider"></div>

      <div id="auth-info" class="auth-info hidden">
        <span>已登录：<b id="auth-name"></b><i id="auth-stats" class="auth-stats"></i></span>
        <button id="auth-logout-btn" class="btn ghost">退出</button>
      </div>

      <div class="join-row">
        <input id="name-input" type="text" maxlength="12" placeholder="输入昵称">
      </div>
      <div class="join-row">
        <input id="room-input" type="text" maxlength="6" placeholder="房间码">
        <button id="copy-room-btn" class="btn ghost" type="button">复制</button>
      </div>
      <div class="join-row">
        <button id="create-room-btn" class="btn start">创建房间</button>
        <button id="join-btn" class="btn primary">加入房间</button>
      </div>
      <div class="join-row theme-row">
        <span class="theme-label">棋盘主题</span>
        <select id="theme-select" class="theme-select">
          <option value="auto">🎨 跟随地图</option>
          <option value="candy">🍬 糖果乐园</option>
          <option value="sakura">🌸 樱花季</option>
          <option value="mint">🌿 薄荷绿</option>
          <option value="sky">☁️ 晴空蓝</option>
        </select>
      </div>

      <div class="players-section">
        <div class="section-head">
          <h2>玩家列表</h2>
          <span id="player-count" class="badge">0/8</span>
        </div>
        <ul id="player-list" class="player-list"></ul>
      </div>

      <details id="room-settings" class="room-settings hidden">
        <summary>⚙️ 房间设置（房主可调）</summary>
        <label>初始资金
          <select id="set-money"><option value="1000">¥1000</option><option value="1500">¥1500</option><option value="2000">¥2000</option><option value="3000">¥3000</option><option value="5000">¥5000</option></select>
        </label>
        <label>回合上限
          <select id="set-rounds"><option value="30">30</option><option value="60">60</option><option value="100">100</option></select>
        </label>
        <label>地图
          <select id="set-map">
            <option value="standard">标准 52 格</option>
            <option value="classic">经典 40 格</option>
            <option value="mini">迷你 32 格</option>
            <option value="metro">都市 44 格</option>
            <option value="space">星际 48 格</option>
          </select>
        </label>
        <label>房价倍率
          <select id="set-house"><option value="0.5">0.5x</option><option value="1">1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
        </label>
        <label><input type="checkbox" id="set-fast"> ⚡ 快速模式（3000 起始 · 开局随机分地 · 租金 ×1.5 · 60 回合 · 45 秒）</label>
        <label><input type="checkbox" id="set-team"> 🤝 团队 2v2（需偶数人数，队友免租）</label>
        <label>存款利息
          <select id="set-interest">
            <option value="0">关闭</option>
            <option value="0.01">1%（默认）</option>
            <option value="0.02">2%</option>
            <option value="0.05">5%</option>
          </select>
        </label>
      </details>
      <button id="add-ai-btn" class="btn ghost hidden">🤖 添加机器人</button>
      <button id="start-btn" class="btn start" disabled>开始游戏</button>
      <p id="lobby-msg" class="msg"></p>
    </div>
  </div>

  <!-- 游戏 -->
  <div id="game" class="screen hidden">
    <div class="game-wrap">
      <div id="board"><div id="bubble-layer" class="bubble-layer"></div></div>
      <aside class="side">
        <!-- 回合状态（最醒目） -->
        <div class="turn-card">
          <div id="turn-title" class="turn-title">等待开始</div>
          <div id="turn-sub" class="turn-sub"></div>
          <div id="dice-display" class="dice-display"></div>
        </div>

        <!-- 操作按钮 -->
        <div class="side-card">
          <div class="action-btns">
            <button id="roll-btn" class="btn primary big hidden">🎲 掷骰子</button>
            <button id="bail-btn" class="btn start hidden">💰 付 ¥50 出狱</button>
            <button id="jailcard-btn" class="btn ghost hidden">🃏 使用出狱卡</button>
            <button id="buy-btn" class="btn start big hidden">买下这块地</button>
            <button id="skip-buy-btn" class="btn ghost hidden">不买，跳过</button>
            <button id="build-btn" class="btn primary big hidden">🏗️ 盖房</button>
            <button id="mortgage-btn" class="btn ghost hidden">🏦 抵押 / 赎回</button>
            <button id="trade-btn" class="btn ghost hidden">🤝 发起交易</button>
            <button id="stock-btn" class="btn ghost hidden">📈 股市</button>
            <button id="loan-btn" class="btn ghost hidden">🏦 贷款</button>
            <button id="end-turn-btn" class="btn primary big hidden">结束回合</button>
            <div id="build-panel" class="build-panel hidden"></div>
            <div id="mortgage-panel" class="panel hidden"></div>
            <div id="trade-panel" class="panel hidden"></div>
            <div id="stock-panel" class="panel hidden"></div>
            <div id="loan-panel" class="panel hidden"></div>
            <div id="trade-offer" class="panel hidden"></div>
            <div id="auction-panel" class="panel hidden"></div>
            <div id="waiting-tip" class="waiting-tip hidden">等待其他玩家操作...</div>
          </div>
        </div>

        <!-- 玩家列表 -->
        <div class="side-card">
          <div class="section-head">
            <h2>玩家</h2>
            <span id="game-player-count" class="badge">0/8</span>
          </div>
          <ul id="game-player-list" class="player-list"></ul>
        </div>

        <details id="chat-box" class="side-card chat-box hidden">
          <summary>💬 快捷语 / 表情</summary>
          <div id="chat-grid" class="chat-grid"></div>
        </details>
        <button id="hotkey-btn" class="btn ghost">⌨️ 快捷键</button>
        <div id="hotkey-panel" class="hotkey-panel hidden">
          <div><kbd>空格</kbd>掷骰子</div>
          <div><kbd>B</kbd>买地</div>
          <div><kbd>E</kbd>结束回合</div>
          <div><kbd>G</kbd>盖房</div>
          <div><kbd>M</kbd>抵押 / 赎回</div>
          <div><kbd>T</kbd>发起交易</div>
        </div>
        <button id="lobby-btn" class="btn ghost">回到大厅</button>
      </aside>

      <!-- 游戏日志（最右列，不遮挡操作区） -->
      <aside id="log-panel" class="log-panel">
        <h2>游戏日志</h2>
        <ul id="log-list" class="log-list"></ul>
      </aside>
    </div>
  </div>

  <div id="card-popup" class="card-popup hidden"><div id="card-popup-inner" class="card-popup-inner"><div id="card-popup-title" class="card-popup-title"></div><div id="card-popup-text" class="card-popup-text"></div></div></div>
  <div id="deed-modal" class="modal hidden">
    <div class="modal-card">
      <div id="deed-content"></div>
      <button id="deed-close" class="btn ghost">关闭</button>
    </div>
  </div>
  <script type="module" src="js/client.js"></script>
</body>
</html>
